schema_version = "1.4"

[metadata]
capability = "follow-through"
category = "follow-through"
difficulty = "medium"
requires_flags = ["reminders"]

[metadata.kortix]
# Every trial runs in a workspace of its own, made for it and deleted after it.
workspace = "fresh"

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 300.0

[verifier.env]
# One judge model for every run: scores from two judges do not compare.
KORTIX_EVAL_JUDGE_MODEL = "deepseek-v4.1-flash"
