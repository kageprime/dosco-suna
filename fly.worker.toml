app = "dosco-worker"
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "2m"

[build]
  dockerfile = "Dockerfile.heroku"
  ignorefile = ".dockerignore.fly"

  [build.args]
    SERVICE = "apps/api"

[deploy]
  strategy = "rolling"
  wait_timeout = "10m"

[env]
  KORTIX_WORKERS_ENABLED = "true"
  PORT = "8008"
  WORKER_DB_POOL_MAX = "5"
  KORTIX_PROJECT_MAINTENANCE_ENABLED = "false"

[processes]
  worker = "/app/apps/api/start-worker.sh"

[checks.worker_ready]
  port = 8008
  type = "http"
  interval = "30s"
  timeout = "5s"
  grace_period = "1m30s"
  method = "get"
  path = "/health/ready"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
