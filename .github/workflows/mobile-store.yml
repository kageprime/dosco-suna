name: Mobile Store

# Releases the mobile app version of the deployed `prod` commit to the App
# Store and Google Play. apps/mobile/scripts/store-release.mjs does each step
# only when it is missing:
#   1. build the version on EAS (prod-store profile) for a platform without one;
#   2. submit the build: Android to the Play production track, iOS to App
#      Store Connect;
#   3. iOS: submit the version for App Review, released after approval.
# A release with no new app version (apps/mobile/app.json) changes nothing.
# JS-only changes ship as OTA updates (mobile-ota.yml), not here.
#
#   Deploy Prod succeeded  -> the deployed commit (a run that failed only in
#                             its Kortix Capture or desktop builds counts too:
#                             deploy-prod-gate.yml)
#   workflow_dispatch      -> the `prod` branch, never unreleased dev code
#   schedule (twice a day) -> the `prod` branch with --finish-only: finishes a
#                             release that stopped halfway, builds nothing
#
# Runbook: apps/mobile/BUILD_GUIDE.md ("Release a store version").

on:
  # workflow_run loads THIS file from dev, then checks out the deployed commit.
  workflow_run:
    workflows: [Deploy Prod]
    types: [completed]
    branches: [prod]
  # Apple takes one version at a time: a version released while the one before
  # it is in review waits, and this run submits it once that one is live. It
  # also finishes a submission a run could not complete. Only Deploy Prod's
  # run and a dispatch build on EAS, so a schedule never ships undeployed code.
  schedule:
    - cron: '17 5,17 * * *' # 05:17 and 17:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read every state, build and submit nothing
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # aws-env reads EXPO_TOKEN from AWS Secrets Manager

jobs:
  gate:
    name: Deploy Prod gate
    # Only a Deploy Prod run of `prod` in this repository, started by a push
    # or a person, reaches the gate. A pull request can run its own copy of a
    # workflow named "Deploy Prod"; that run must never reach the credentials.
    if: >-
      github.event_name == 'workflow_run' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_branch == 'prod' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      actions: read # the gate reads the jobs of the Deploy Prod run
    uses: ./.github/workflows/deploy-prod-gate.yml

  busy:
    name: Another store release is queued or running
    # A scheduled run starts only when no other Mobile Store run is queued or
    # running. In the `mobile-store` group a newly queued run replaces the one
    # already pending, so a schedule queued behind a release could replace the
    # Deploy Prod run waiting there, and a scheduled run never builds.
    if: github.event_name == 'schedule'
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      busy: ${{ steps.check.outputs.busy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          others=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow mobile-store.yml --limit 20 \
            --json databaseId,status --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .status != \"completed\")] | length")
          echo "Other Mobile Store runs queued or running: $others"
          if [ "$others" -eq 0 ]; then echo "busy=false" >> "$GITHUB_OUTPUT"; else echo "busy=true" >> "$GITHUB_OUTPUT"; fi

  release:
    name: Release to the stores
    needs: [gate, busy]
    # A dispatch, a schedule with no other release queued or running, or a
    # Deploy Prod run the gate passed: it succeeded, or only its Kortix Capture
    # or desktop builds failed (deploy-prod-gate.yml).
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && needs.busy.outputs.busy == 'false') ||
       needs.gate.outputs.ship == 'true')
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    # An iOS build (~20 min), Apple processing (up to 60 min) and an Android
    # build run one after another; EAS builds may also queue.
    timeout-minutes: 180
    # One release at a time, never cancelled: a cancelled run can leave a build
    # unsubmitted (the next run finishes it).
    concurrency:
      group: mobile-store
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The released code only: store builds call the production API.
          ref: ${{ github.event.workflow_run.head_sha || 'prod' }}
          # The script ships only builds made from a commit of this history
          # (git merge-base --is-ancestor), so it needs all of it.
          fetch-depth: 0

      # Before any credential is read: the commit must be part of `prod`.
      - name: Require a commit of prod
        run: |
          git merge-base --is-ancestor HEAD origin/prod || {
            echo "::error::$(git rev-parse HEAD) is not a commit of origin/prod; refusing to release it."
            exit 1
          }

      - name: Check out the aws-env action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .aws-env
          sparse-checkout: .github/actions
          persist-credentials: false
      - name: Read credentials from AWS Secrets Manager
        uses: ./.aws-env/.github/actions/aws-env
        with:
          # EXPO_TOKEN: Expo robot token for the `kortix` account. The App Store
          # Connect key comes from EAS at run time, not from this store.
          keys: |
            EXPO_TOKEN
            SLACK_BOT_TOKEN?
            SLACK_RELEASE_CHANNEL?

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile
          # The root .npmrc sets ignore-scripts=true, so the install skipped
          # apps/mobile's postinstall. The native fingerprint check needs the
          # patched tree, as in mobile-ota.yml.
          pnpm --dir apps/mobile exec patch-package --error-on-fail
          npm install --global eas-cli@20.3.0
        env:
          npm_config_engine_strict: "false"

      - name: Release
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          args=()
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          if [ "$EVENT" = schedule ]; then
            # The script comes from prod. A prod copy without --finish-only
            # would build on a schedule, so the run stops until prod has it.
            if ! grep -q -e '--finish-only' apps/mobile/scripts/store-release.mjs; then
              echo "::notice::The released store-release.mjs has no --finish-only; this scheduled run changes nothing."
              exit 0
            fi
            args+=(--finish-only)
          fi
          node apps/mobile/scripts/store-release.mjs "${args[@]}"
