<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:;" />
    <title>Dosco</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: #ffffff;
        --foreground: #09090b;
        --muted-foreground: #71717a;
        --glow: rgba(239, 68, 68, 0.15);
        --font-sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #09090b;
          --foreground: #f4f4f5;
          --muted-foreground: #a1a1aa;
          --glow: rgba(239, 68, 68, 0.25);
        }
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--background);
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-app-region: drag;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
        justify-content: center;
        font-family: var(--font-sans);
      }
      .crest-box {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
      }
      .crest-glow {
        position: absolute;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
        animation: pulse-glow 2.4s ease-in-out infinite;
      }
      .crest {
        position: relative;
        width: 60px;
        height: 60px;
        object-fit: contain;
        animation: pulse-crest 2.4s ease-in-out infinite;
      }
      @keyframes pulse-glow {
        0%, 100% { transform: scale(0.9); opacity: 0.6; }
        50% { transform: scale(1.35); opacity: 1; }
      }
      @keyframes pulse-crest {
        0%, 100% { transform: scale(0.97); }
        50% { transform: scale(1.03); }
      }
      .bar-track {
        width: 96px;
        height: 2px;
        background: rgba(125, 125, 125, 0.15);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .bar-indeterminate {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 40%;
        background: linear-gradient(90deg, #f97316, #ef4444);
        border-radius: 999px;
        animation: progress 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes progress {
        0% { left: -40%; width: 30%; }
        50% { width: 50%; }
        100% { left: 100%; width: 30%; }
      }
      #kx-status {
        min-height: 14px;
        font-size: 12px;
        font-weight: 500;
        line-height: 14px;
        color: var(--muted-foreground);
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="crest-box">
        <div class="crest-glow"></div>
        <img src="dosco-crest.png" alt="Dosco" class="crest" draggable="false" />
      </div>
      <div class="bar-track">
        <div class="bar-indeterminate"></div>
      </div>
      <div id="kx-status" aria-live="polite"></div>
    </div>
  </body>
</html>
