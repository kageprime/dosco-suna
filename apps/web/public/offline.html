<html lang="en">
<!--
  Dosco offline fallback. Served by the service worker when the network is dead
  and no cached route HTML exists, so it must render with zero network: one
  inline style block, one inline data-URI logo, no script, no font, no external
  resource. Palette is the manifest's own (#000000 / white); the tokens.css
  var() rule cannot apply to a page that loads while caches are empty.
-->

    :root {
      color-scheme: dark light;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #000000;
      color: #ffffff;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }
    main {
      max-width: 20rem;
      display: grid;
      justify-items: center;
      gap: 0.75rem;
    }
    .brand-mark {
      width: 2.25rem;
      height: 2.25rem;
      object-fit: contain;
      margin-bottom: 0.5rem;
      user-select: none;
    }
    h1 {
      font-size: 1.125rem;
      font-weight: 550;
      margin: 0;
    }
    p {
      margin: 0;
      font-size: 0.875rem;
      line-height: 1.5;
      opacity: 0.64;
    }
    a {
      margin-top: 0.75rem;
      display: inline-block;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 0.375rem;
      color: #ffffff;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
    }
    a:active {
      background: rgba(255, 255, 255, 0.08);
    }
    @media (prefers-color-scheme: light) {
      body {
        background: #ffffff;
        color: #000000;
      }
      a {
        border-color: rgba(0, 0, 0, 0.24);
        color: #000000;
      }
      a:active {
        background: rgba(0, 0, 0, 0.06);
      }
    }
  </style>
