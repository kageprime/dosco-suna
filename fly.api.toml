app = "dosco-api"
# Supabase is in eu-west-1. From iad a round trip cost 91 ms; from lhr it costs
# 11-12 ms. Every browser request pays that RTT once for Supabase Auth and once
# per SQL statement, so a US API against this database saturates the DB
# admission gate and answers 503 db_pool_busy.
primary_region = "lhr"
kill_signal = "SIGTERM"
kill_timeout = "2m"

[build]
  dockerfile = "Dockerfile.heroku"
  ignorefile = ".dockerignore.fly"

  [build.args]
    SERVICE = "apps/api"

[deploy]
  strategy = "rolling"
  wait_timeout = "10m"
  # Schema changes ship with the image. Without this command the API starts
  # against a stale schema (2026-11-28: artifacts 500, column
  # "gallery_folder_id" missing). NODE_TLS_REJECT_UNAUTHORIZED is scoped to
  # this one-off process: pg verifies sslmode=require against Supavisor's
  # chain and otherwise fails with SELF_SIGNED_CERT_IN_CHAIN.
  release_command = "cd /app && NODE_TLS_REJECT_UNAUTHORIZED=0 bun packages/db/scripts/migrate.ts up"

[env]
  PORT = "8008"
  KORTIX_WORKERS_ENABLED = "false"
  KORTIX_PROCESS_ROLE = "web"
  # Pool of 14 gives the admission gate a ceiling of 12. The values are also
  # set as Fly secrets; keep both in sync so a new machine gets them even if
  # `secrets set` is rerun only for the machines that already exist.
  DB_POOL_MAX = "14"
  DB_ADMISSION_WAIT_MS = "4000"

[processes]
  web = "/app/apps/api/start.sh"

[http_service]
  internal_port = 8008
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "1m30s"
    method = "get"
    path = "/health/ready"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
